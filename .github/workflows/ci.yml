name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            typo3: '^13.4.35'
          - php: '8.4'
            typo3: '^13.4.35'
          - php: '8.3'
            typo3: '^14.3.7'
          - php: '8.4'
            typo3: '^14.3.7'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --no-update typo3/cms-core:${{ matrix.typo3 }}
      - run: composer install --no-progress
      - run: vendor/bin/phpstan analyse

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-progress
      # Fails on any published advisory against a resolved dependency, so a new TYPO3 core
      # security release turns the build red until the floor is raised past it.
      - run: composer audit --no-interaction

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-progress
      - run: vendor/bin/phpcs

  tests:
    name: Tests (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            typo3: '^13.4.35'
          - php: '8.4'
            typo3: '^13.4.35'
          - php: '8.4'
            typo3: '^14.3.7'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --no-update typo3/cms-core:${{ matrix.typo3 }}
      - run: composer install --no-progress
      - run: vendor/bin/phpunit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer install --no-progress
      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text=coverage.txt --colors=never
      - name: Write coverage summary to job output
        if: always()
        run: |
          {
            echo "## Code Coverage"
            echo ""
            echo '```'
            grep -A3 "^ Summary:" coverage.txt || echo "No coverage summary found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
